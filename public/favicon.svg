<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Glowing outer gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Interior letter T gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle interior fill gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#glowGrad)" filter="url(#shadow)" />

  <!-- Badge Body Background -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />

  <!-- Stylized Bold Letter "T" -->
  <text x="24" y="32" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" 
        font-weight="900" 
        fill="url(#tGrad)"
        letter-spacing="-1">T</text>

  <!-- Cyan Accent Node -->
  <circle cx="37" cy="11" r="2.5" fill="#22d3ee" stroke="#0891b2" stroke-width="0.8" />
</svg>